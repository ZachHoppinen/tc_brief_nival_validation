# One conda env that runs the whole pipeline (src/nival/paper_workflow.py):
#
#     conda env create -f environment.yml
#     conda activate nival
#     pip install --no-deps nisar_pytools
#
# numpy is pinned to 1.26.4 because isce3 requires numpy < 2.
name: nival
channels:
  - conda-forge
dependencies:
  - python>=3.12,<3.13
  # --- unwrap_20m: effective looks + SNAPHU ---
  - isce3            # isce3 + nisar.workflows.unwrap.get_effective_looks
  - snaphu           # phase unwrapping (snaphu-py)
  # --- remote data fetches: download_paper_data ---
  - earthaccess      # NSIDC / ASF via NASA Earthdata
  - requests
  - dem_stitcher     # public Copernicus GLO-30 DEM, geoid->ellipsoid
  # --- retrieval + stats + figures ---
  - numpy=1.26.4
  - scipy
  - pandas<3
  - h5py
  - netcdf4
  - xarray
  - rioxarray
  - rasterio
  - pyproj
  - shapely
  - geopandas        # reads the hand-drawn inset shapefile
  - matplotlib
  - cartopy
  - cmocean          # colour maps
  - pillow           # resizes figures to the print width
  # --- nisar_pytools' own deps, so the --no-deps pip install below finds them ---
  - asf_search
  - dask
  - pyyaml
  - pip
# nisar_pytools (retrieval's local incidence angle) is installed in a SECOND step with
# pip --no-deps, NOT here, so pip does not re-resolve its deps: a plain pip install can pull
# a PyPI gdal (won't compile against the conda gdal headers) and numpy 2 (breaks isce3).
